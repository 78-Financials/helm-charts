{{- if .Values.env.external_secret.create }}
apiVersion: {{ .Values.env.external_secret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.deployment.name | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.env.external_secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.env.external_secret.secretStoreName }}
    kind: {{ .Values.env.external_secret.secretStoreKind }}
  target:
    name: {{ include "payaza.externalSecretName" . | quote }}
  dataFrom:
    - extract:
        key: {{ required "env.external_secret.secretManagerRef is required when env.external_secret.create is true" .Values.env.external_secret.secretManagerRef }}
{{- end }}
{{- if .Values.env.crypto_secret.create }}
---
apiVersion: {{ .Values.env.crypto_secret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.deployment.name }}-crypto-keys
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.env.crypto_secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.env.crypto_secret.secretStoreName }}
    kind: {{ .Values.env.crypto_secret.secretStoreKind }}
  target:
    name: {{ default (printf "%s-crypto-keys" .Values.deployment.name) .Values.env.crypto_secret.secretName | quote }}
  dataFrom:
    - extract:
        key: {{ required "env.crypto_secret.secretManagerRef is required when env.crypto_secret.create is true" .Values.env.crypto_secret.secretManagerRef }}
{{- end }}
