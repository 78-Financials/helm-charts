{{- $replicas := int (ternary .Values.autoscaling.minReplicas .Values.deployment.replicas .Values.autoscaling.enabled) }}
{{- if and .Values.pdb.enabled (ge $replicas 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.deployment.name | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  # This handles both strings ("50%") and integers (1)
  minAvailable: {{ .Values.pdb.minAvailable | default "50%" }}
  selector:
    matchLabels:
      app: {{ .Values.deployment.name | quote }}
{{- end }}
