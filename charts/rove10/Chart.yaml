apiVersion: v2
name: rove10
description: >-
  Rove10 application chart. 1.0.0 replaces the unrelated 2023 0.1.x chart of
  the same name: it is forked from payaza-v2 1.1.3 with classic Ingress
  replaced by a Gateway API HTTPRoute (also for the blue-green green stack),
  since the rove10 cluster's Traefik serves Gateway API only. Helper names
  are kept as payaza.* so upstream payaza-v2 fixes diff cleanly.

type: application

# This is the chart version. Bump it on every change to the chart or its templates.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.0.0

# appVersion is deliberately unset: the app version is the image tag (`deployment.tag`),
# which the app.kubernetes.io/version label uses.
